<!doctype html><meta charset="utf-8"><title>Rendu de gabarit</title>
<link rel="stylesheet" href="../atelier/polices.css">
<style>html,body{margin:0;background:#fff}svg{display:block}#planche{display:flex;flex-wrap:wrap;gap:12px;padding:12px;width:1000px;--l:168px;background:#fff;font:12px Archivo,sans-serif}#planche figure{margin:0;width:var(--l)}#planche figcaption{margin-top:4px;color:#333}#planche svg{width:var(--l);height:auto}</style>
<body><script type="module">
// Charge un ou plusieurs fichiers SVG de gabarit et les insère tels quels (les liens d'images sont résolus depuis leur dossier).
const q = new URLSearchParams(location.search);
// Identifiants préfixés : plusieurs SVG dans une même page ne doivent pas partager leurs filtres ni leurs découpes
const isoler = (svg, k) => svg.replace(/\bid="([^"]+)"/g, `id="${k}-$1"`).replace(/url\(#([^)]+)\)/g, `url(#${k}-$1)`);
let n = 0;
const charger = async (f) => { const t = await (await fetch('../' + f)).text(); const base = '../' + f.slice(0, f.lastIndexOf('/') + 1); return isoler(t.replace(/(xlink:href|href)="(?!data:|https?:|\/|#)([^"]+)"/g, (m, a, h) => `${a}="${base}${h}"`), `s${n++}`); };
if (q.get('f')) document.body.innerHTML = await charger(q.get('f'));
else if (q.get('planche')) { const fs = q.get('planche').split(','); document.body.innerHTML = `<div id="planche" style="--l:${+q.get('l') || 168}px">` + (await Promise.all(fs.map(async (f) => `<figure>${await charger(f)}<figcaption>${f.split('/')[2]}/${f.split('_')[3]}</figcaption></figure>`))).join('') + '</div>'; }
// Rendu déterministe : polices chargées, toutes les images préchargées et décodées, puis deux images d'affichage
await document.fonts.ready;
const urls = [...new Set([...document.querySelectorAll('image')].map((i) => i.getAttribute('href')))];
await Promise.all(urls.map((u) => { const i = new Image(); i.src = u; return i.decode().catch(() => {}); }));
await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 300)))); window.pret = true;
</script></body>
